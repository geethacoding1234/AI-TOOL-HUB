{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>AI Summarizer | AI Tool Hub</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {

            font-family:
                "Segoe UI",
                Arial,
                sans-serif;

            min-height: 100vh;

            color: white;

            background:
                linear-gradient(
                    rgba(3, 10, 22, 0.72),
                    rgba(3, 10, 22, 0.84)
                ),
                url("{% static 'images/ai-background.jpg' %}");

            background-size: cover;

            background-position: center;

            background-attachment: fixed;

            overflow-x: hidden;
        }


        /* =========================================
           BACK BUTTON
        ========================================= */

        .back-button {

            position: fixed;

            top: 25px;

            right: 30px;

            padding: 10px 18px;

            border-radius: 10px;

            text-decoration: none;

            color: white;

            background:
                rgba(255, 255, 255, 0.08);

            border:
                1px solid rgba(255, 255, 255, 0.18);

            backdrop-filter: blur(12px);

            -webkit-backdrop-filter: blur(12px);

            font-size: 14px;

            transition: 0.2s;

            z-index: 100;
        }


        .back-button:hover {

            background:
                rgba(255, 255, 255, 0.16);

            transform:
                translateY(-2px);
        }


        /* =========================================
           MAIN CONTAINER
        ========================================= */

        .container {

            width: 90%;

            max-width: 1200px;

            margin: 0 auto;

            padding:
                100px 0 50px;
        }


        /* =========================================
           HEADER
        ========================================= */

        .header {

            text-align: center;

            margin-bottom: 40px;
        }


        .header h1 {

            font-size: 42px;

            margin-bottom: 12px;
        }


        .header p {

            color:
                rgba(255, 255, 255, 0.72);

            font-size: 16px;
        }


        /* =========================================
           SUMMARIZER BOX
        ========================================= */

        .summarizer-box {

            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 25px;
        }


        .panel {

            background:
                rgba(255, 255, 255, 0.065);

            border:
                1px solid
                rgba(255, 255, 255, 0.14);

            border-radius: 20px;

            padding: 25px;

            backdrop-filter: blur(20px);

            -webkit-backdrop-filter: blur(20px);

            box-shadow:
                0 10px 40px
                rgba(0, 0, 0, 0.25);
        }


        .panel h2 {

            font-size: 20px;

            margin-bottom: 18px;
        }


        /* =========================================
           TEXTAREA
        ========================================= */

        textarea {

            width: 100%;

            min-height: 350px;

            resize: vertical;

            padding: 18px;

            border-radius: 14px;

            border:
                1px solid
                rgba(255, 255, 255, 0.15);

            outline: none;

            background:
                rgba(0, 0, 0, 0.20);

            color: white;

            font-size: 15px;

            font-family:
                "Segoe UI",
                Arial,
                sans-serif;
        }


        textarea::placeholder {

            color:
                rgba(255, 255, 255, 0.45);
        }


        textarea:focus {

            border-color:
                rgba(255, 255, 255, 0.35);
        }


        /* =========================================
           OPTIONS
        ========================================= */

        .options {

            margin-top: 18px;
        }


        .options label {

            display: block;

            margin-bottom: 8px;

            font-size: 14px;

            color:
                rgba(255, 255, 255, 0.75);
        }


        select {

            width: 100%;

            padding: 13px;

            border-radius: 10px;

            border:
                1px solid
                rgba(255, 255, 255, 0.15);

            outline: none;

            background:
                rgba(0, 0, 0, 0.30);

            color: white;

            font-size: 14px;
        }


        select option {

            background: #111827;

            color: white;
        }


        /* =========================================
           BUTTON
        ========================================= */

        .summarize-button {

            width: 100%;

            margin-top: 18px;

            padding: 14px;

            border: none;

            border-radius: 12px;

            background:
                rgba(255, 255, 255, 0.12);

            border:
                1px solid
                rgba(255, 255, 255, 0.18);

            color: white;

            font-size: 15px;

            font-weight: 600;

            cursor: pointer;

            transition: 0.2s;
        }


        .summarize-button:hover {

            background:
                rgba(255, 255, 255, 0.20);

            transform:
                translateY(-2px);
        }


        .summarize-button:disabled {

            opacity: 0.5;

            cursor: not-allowed;

            transform: none;
        }


        /* =========================================
           OUTPUT
        ========================================= */

        .summary-output {

            min-height: 350px;

            padding: 18px;

            border-radius: 14px;

            background:
                rgba(0, 0, 0, 0.20);

            border:
                1px solid
                rgba(255, 255, 255, 0.12);

            color:
                rgba(255, 255, 255, 0.9);

            font-size: 15px;

            line-height: 1.7;

            white-space: pre-wrap;

            overflow-y: auto;
        }


        .summary-placeholder {

            color:
                rgba(255, 255, 255, 0.40);
        }


        /* =========================================
           RESPONSIVE
        ========================================= */

        @media (max-width: 800px) {

            .summarizer-box {

                grid-template-columns: 1fr;
            }


            .header h1 {

                font-size: 32px;
            }


            .back-button {

                top: 15px;

                right: 15px;

                font-size: 12px;

                padding:
                    8px 12px;
            }


            .container {

                padding-top: 90px;
            }
        }

    </style>

</head>


<body>


<!-- =========================================
     BACK TO AI TOOL HUB
========================================= -->

<a href="/"
   class="back-button">

    ← Back to AI Tool Hub

</a>


<!-- =========================================
     MAIN CONTAINER
========================================= -->

<div class="container">


    <!-- CSRF TOKEN -->

    <form style="display:none;">

        {% csrf_token %}

    </form>


    <!-- =========================================
         HEADER
    ========================================= -->

    <div class="header">

        <h1>
            📝 AI Summarizer
        </h1>

        <p>
            Turn long text into clear and concise summaries
        </p>

    </div>


    <!-- =========================================
         SUMMARIZER
    ========================================= -->

    <div class="summarizer-box">


        <!-- =====================================
             INPUT PANEL
        ====================================== -->

        <div class="panel">

            <h2>
                Enter Your Text
            </h2>


            <textarea
                id="inputText"
                placeholder="Paste or type the text you want to summarize...">
            </textarea>


            <div class="options">

                <label for="summaryLength">
                    Summary Length
                </label>


                <select
                    id="summaryLength">

                    <option value="short">
                        Short
                    </option>

                    <option value="medium"
                            selected>
                        Medium
                    </option>

                    <option value="detailed">
                        Detailed
                    </option>

                </select>

            </div>


            <button
                id="summarizeButton"
                class="summarize-button">

                ✨ Summarize Text

            </button>

        </div>


        <!-- =====================================
             OUTPUT PANEL
        ====================================== -->

        <div class="panel">

            <h2>
                AI Summary
            </h2>


            <div
                id="summaryOutput"
                class="summary-output">

                <span class="summary-placeholder">

                    Your AI-generated summary
                    will appear here...

                </span>

            </div>

        </div>


    </div>


</div>


<!-- =========================================
     JAVASCRIPT
========================================= -->

<script>


const summarizeButton =
    document.getElementById(
        "summarizeButton"
    );


const inputText =
    document.getElementById(
        "inputText"
    );


const summaryLength =
    document.getElementById(
        "summaryLength"
    );


const summaryOutput =
    document.getElementById(
        "summaryOutput"
    );


const csrfToken =
    document.querySelector(
        "[name=csrfmiddlewaretoken]"
    ).value;



summarizeButton.addEventListener(
    "click",
    async function () {


        const text =
            inputText.value.trim();


        const length =
            summaryLength.value;


        /* =========================
           EMPTY TEXT
        ========================= */

        if (!text) {

            summaryOutput.textContent =
                "Please enter some text to summarize.";

            return;
        }


        /* =========================
           UI STATE
        ========================= */

        summarizeButton.disabled = true;

        summarizeButton.textContent =
            "⏳ Summarizing...";


        summaryOutput.textContent = "";


        try {


            /* =========================
               SEND REQUEST
            ========================= */

            const response =
                await fetch(
                    "/summarizer/",
                    {

                        method: "POST",

                        headers: {

                            "Content-Type":
                                "application/x-www-form-urlencoded",

                            "X-CSRFToken":
                                csrfToken

                        },

                        body:
                            new URLSearchParams({

                                text: text,

                                length: length

                            })

                    }
                );


            /* =========================
               ERROR CHECK
            ========================= */

            if (!response.ok) {

                throw new Error(
                    "Server error: " +
                    response.status
                );
            }


            /* =========================
               READ STREAM
            ========================= */

            const reader =
                response.body.getReader();


            const decoder =
                new TextDecoder();


            while (true) {


                const {
                    value,
                    done
                } =
                    await reader.read();


                if (done) {

                    break;
                }


                const chunk =
                    decoder.decode(
                        value,
                        {
                            stream: true
                        }
                    );


                summaryOutput.textContent +=
                    chunk;


                summaryOutput.scrollTop =
                    summaryOutput.scrollHeight;
            }


        }


        catch (error) {

            console.error(error);


            summaryOutput.textContent =
                "Something went wrong. Please try again.";
        }


        finally {

            summarizeButton.disabled = false;

            summarizeButton.textContent =
                "✨ Summarize Text";
        }

    }
);

</script>


</body>

</html>
