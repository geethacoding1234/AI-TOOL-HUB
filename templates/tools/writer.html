{% load static %}

<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>AI Writer | AI Tool Hub</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {

            font-family:
                "Segoe UI",
                Arial,
                sans-serif;

            min-height: 100vh;

            color: white;

            background:

                linear-gradient(
                    rgba(3, 10, 22, 0.45),
                    rgba(3, 10, 22, 0.60)
                ),

                url("{% static 'images/ai-background.jpg' %}");

            background-size: cover;

            background-position: center;

            background-attachment: fixed;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 30px;

        }


        .writer-container {

            width: 100%;

            max-width: 1000px;

            min-height: 650px;

            padding: 30px;

            background:
                rgba(255, 255, 255, 0.035);

            border:
                1px solid rgba(255, 255, 255, 0.15);

            border-radius: 24px;

            backdrop-filter: blur(18px);

            -webkit-backdrop-filter: blur(18px);

            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.30);

        }


        /* HEADER */

        .header {

            text-align: center;

            margin-bottom: 30px;

        }


        .header-icon {

            font-size: 45px;

            margin-bottom: 10px;

        }


        .header h1 {

            font-size: 30px;

            margin-bottom: 8px;

        }


        .header p {

            color:
                rgba(255, 255, 255, 0.70);

            font-size: 15px;

        }


        /* WRITER AREA */

        .writer-area {

            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 20px;

        }


        .panel {

            background:
                rgba(255, 255, 255, 0.045);

            border:
                1px solid rgba(255, 255, 255, 0.12);

            border-radius: 18px;

            padding: 20px;

            backdrop-filter: blur(10px);

        }


        .panel h2 {

            font-size: 18px;

            margin-bottom: 15px;

        }


        textarea {

            width: 100%;

            height: 350px;

            resize: none;

            border: none;

            outline: none;

            border-radius: 12px;

            padding: 15px;

            font-family:
                "Segoe UI",
                Arial,
                sans-serif;

            font-size: 15px;

            color: white;

            background:
                rgba(255, 255, 255, 0.045);

            border:
                1px solid rgba(255, 255, 255, 0.12);

        }


        textarea::placeholder {

            color:
                rgba(255, 255, 255, 0.50);

        }


        .options {

            display: flex;

            gap: 10px;

            margin-top: 15px;

            flex-wrap: wrap;

        }


        select {

            padding: 10px 14px;

            border-radius: 10px;

            border:
                1px solid rgba(255, 255, 255, 0.15);

            background:
                rgba(255, 255, 255, 0.06);

            color: white;

            outline: none;

        }


        select option {

            background: #111827;

            color: white;

        }


        button {

            margin-top: 15px;

            width: 100%;

            padding: 13px;

            border-radius: 12px;

            border:
                1px solid rgba(255, 255, 255, 0.15);

            background:
                rgba(255, 255, 255, 0.10);

            color: white;

            font-size: 15px;

            cursor: pointer;

            transition: 0.2s;

        }


        button:hover {

            background:
                rgba(255, 255, 255, 0.18);

        }


        button:disabled {

            opacity: 0.5;

            cursor: not-allowed;

        }


        #output {

            height: 350px;

            overflow-y: auto;

            white-space: pre-wrap;

            line-height: 1.6;

            color:
                rgba(255, 255, 255, 0.90);

        }


        .back {

            display: block;

            text-align: center;

            margin-top: 25px;

            color:
                rgba(255, 255, 255, 0.75);

            text-decoration: none;

            font-size: 14px;

        }


        .back:hover {

            color: white;

        }


        @media (max-width: 700px) {

            body {

                padding: 10px;

            }


            .writer-container {

                padding: 20px;

            }


            .writer-area {

                grid-template-columns: 1fr;

            }


            textarea,
            #output {

                height: 280px;

            }

        }

    </style>

</head>


<body>


<div class="writer-container">


    <!-- HEADER -->

    <div class="header">

        <div class="header-icon">
            ✍️
        </div>

        <h1>
            AI Writer
        </h1>

        <p>
            Create professional content with AI
        </p>

    </div>


    <!-- WRITER AREA -->

    <div class="writer-area">


        <!-- INPUT -->

        <div class="panel">
            
             {% csrf_token %}

            <h2>
                What do you want to write?
            </h2>


            <textarea
                id="prompt"
                placeholder="Example: Write a professional email requesting leave for two days...">
            </textarea>


            <div class="options">

                <select id="type">

                    <option value="professional">
                        Professional
                    </option>

                    <option value="email">
                        Email
                    </option>

                    <option value="article">
                        Article
                    </option>

                    <option value="social">
                        Social Media
                    </option>

                    <option value="creative">
                        Creative
                    </option>

                </select>


                <select id="length">

                    <option value="short">
                        Short
                    </option>

                    <option value="medium">
                        Medium
                    </option>

                    <option value="long">
                        Long
                    </option>

                </select>

            </div>


            <button
                id="generateButton">

                ✨ Generate Content

            </button>

        </div>


        <!-- OUTPUT -->

        <div class="panel">

            <h2>
                Generated Content
            </h2>


            <div id="output">

                Your generated content
                will appear here...

            </div>

        </div>


    </div>


    <a
        href="/"
        class="back">

        ← Back to AI Tool Hub

    </a>


</div>


<script>

const generateButton =
    document.getElementById("generateButton");

const promptInput =
    document.getElementById("prompt");

const typeInput =
    document.getElementById("type");

const lengthInput =
    document.getElementById("length");

const output =
    document.getElementById("output");


generateButton.addEventListener(
    "click",
    async function() {

        const prompt =
            promptInput.value.trim();


        if (!prompt) {

            output.textContent =
                "Please enter what you want to write.";

            return;

        }


        generateButton.disabled = true;

        output.textContent =
            "Generating...";


        try {

            const csrfToken =
                document.querySelector(
                    "[name=csrfmiddlewaretoken]"
                );

            const response =
                await fetch(
                    "/writer/",
                    {

                        method: "POST",

                        headers: {

                            "Content-Type":
                                "application/x-www-form-urlencoded",

                            "X-CSRFToken":
                                csrfToken
                                ? csrfToken.value
                                : ""

                        },

                        body:
                            new URLSearchParams({

                                prompt: prompt,

                                type:
                                    typeInput.value,

                                length:
                                    lengthInput.value

                            })

                    }
                );


            if (!response.ok) {

                throw new Error(
                    "Server error: " +
                    response.status
                );

            }


            output.textContent = "";


            const reader =
                response.body.getReader();

            const decoder =
                new TextDecoder();


            while (true) {

                const {
                    value,
                    done
                } =
                    await reader.read();


                if (done) {

                    break;

                }


                const chunk =
                    decoder.decode(
                        value,
                        {
                            stream: true
                        }
                    );


                output.textContent +=
                    chunk;

            }


        }

        catch (error) {

            output.textContent =
                "Something went wrong.\n\n" +
                error.message;

        }


        generateButton.disabled = false;

    }

);

</script>


</body>

</html>
