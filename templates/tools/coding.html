{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>AI Coding Assistant | AI Tool Hub</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {

            font-family:
                "Segoe UI",
                Arial,
                sans-serif;

            min-height: 100vh;

            color: white;

            background:
                linear-gradient(
                    rgba(3, 10, 22, 0.72),
                    rgba(3, 10, 22, 0.84)
                ),
                url("{% static 'images/ai-background.jpg' %}");

            background-size: cover;

            background-position: center;

            background-attachment: fixed;

            overflow-x: hidden;
        }


        /* =========================================
           BACK BUTTON
        ========================================= */

        .back-button {

            position: fixed;

            top: 25px;

            right: 30px;

            padding: 10px 18px;

            border-radius: 10px;

            text-decoration: none;

            color: white;

            background:
                rgba(255, 255, 255, 0.08);

            border:
                1px solid
                rgba(255, 255, 255, 0.18);

            backdrop-filter: blur(12px);

            -webkit-backdrop-filter: blur(12px);

            font-size: 14px;

            transition: 0.2s;

            z-index: 100;
        }


        .back-button:hover {

            background:
                rgba(255, 255, 255, 0.16);

            transform:
                translateY(-2px);
        }


        /* =========================================
           MAIN CONTAINER
        ========================================= */

        .container {

            width: 90%;

            max-width: 1250px;

            margin: auto;

            padding:
                100px 0 50px;
        }


        /* =========================================
           HEADER
        ========================================= */

        .header {

            text-align: center;

            margin-bottom: 40px;
        }


        .header h1 {

            font-size: 42px;

            margin-bottom: 12px;
        }


        .header p {

            color:
                rgba(255, 255, 255, 0.72);

            font-size: 16px;
        }


        /* =========================================
           CODING AREA
        ========================================= */

        .coding-box {

            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 25px;
        }


        .panel {

            background:
                rgba(255, 255, 255, 0.065);

            border:
                1px solid
                rgba(255, 255, 255, 0.14);

            border-radius: 20px;

            padding: 25px;

            backdrop-filter: blur(20px);

            -webkit-backdrop-filter: blur(20px);

            box-shadow:
                0 10px 40px
                rgba(0, 0, 0, 0.25);
        }


        .panel h2 {

            font-size: 20px;

            margin-bottom: 20px;
        }


        /* =========================================
           FORM GROUP
        ========================================= */

        .form-group {

            margin-bottom: 18px;
        }


        .form-group label {

            display: block;

            margin-bottom: 8px;

            font-size: 14px;

            color:
                rgba(255, 255, 255, 0.75);
        }


        /* =========================================
           SELECT
        ========================================= */

        select {

            width: 100%;

            padding: 13px;

            border-radius: 10px;

            border:
                1px solid
                rgba(255, 255, 255, 0.15);

            outline: none;

            background:
                rgba(0, 0, 0, 0.30);

            color: white;

            font-size: 14px;
        }


        select option {

            background: #111827;

            color: white;
        }


        /* =========================================
           TEXTAREA
        ========================================= */

        textarea {

            width: 100%;

            min-height: 300px;

            resize: vertical;

            padding: 18px;

            border-radius: 14px;

            border:
                1px solid
                rgba(255, 255, 255, 0.15);

            outline: none;

            background:
                rgba(0, 0, 0, 0.22);

            color: white;

            font-size: 14px;

            font-family:
                Consolas,
                "Courier New",
                monospace;

            line-height: 1.6;
        }


        textarea::placeholder {

            color:
                rgba(255, 255, 255, 0.40);
        }


        textarea:focus {

            border-color:
                rgba(255, 255, 255, 0.35);
        }


        /* =========================================
           TASK SELECT
        ========================================= */

        .task-description {

            margin-top: 8px;

            font-size: 12px;

            color:
                rgba(255, 255, 255, 0.48);
        }


        /* =========================================
           BUTTON
        ========================================= */

        .coding-button {

            width: 100%;

            margin-top: 5px;

            padding: 14px;

            border: none;

            border-radius: 12px;

            background:
                rgba(255, 255, 255, 0.12);

            border:
                1px solid
                rgba(255, 255, 255, 0.18);

            color: white;

            font-size: 15px;

            font-weight: 600;

            cursor: pointer;

            transition: 0.2s;
        }


        .coding-button:hover {

            background:
                rgba(255, 255, 255, 0.20);

            transform:
                translateY(-2px);
        }


        .coding-button:disabled {

            opacity: 0.5;

            cursor: not-allowed;

            transform: none;
        }


        /* =========================================
           OUTPUT
        ========================================= */

        .code-output {

            min-height: 430px;

            padding: 18px;

            border-radius: 14px;

            background:
                rgba(0, 0, 0, 0.25);

            border:
                1px solid
                rgba(255, 255, 255, 0.12);

            color:
                rgba(255, 255, 255, 0.92);

            font-family:
                Consolas,
                "Courier New",
                monospace;

            font-size: 14px;

            line-height: 1.7;

            white-space: pre-wrap;

            overflow-x: auto;

            overflow-y: auto;
        }


        .output-placeholder {

            color:
                rgba(255, 255, 255, 0.40);

            font-family:
                "Segoe UI",
                Arial,
                sans-serif;
        }


        /* =========================================
           RESPONSIVE
        ========================================= */

        @media (max-width: 850px) {

            .coding-box {

                grid-template-columns: 1fr;
            }


            .header h1 {

                font-size: 32px;
            }


            .back-button {

                top: 15px;

                right: 15px;

                font-size: 12px;

                padding:
                    8px 12px;
            }


            .container {

                padding-top: 90px;
            }

        }

    </style>

</head>


<body>


<!-- =========================================
     BACK TO AI TOOL HUB
========================================= -->

<a href="/"
   class="back-button">

    ← Back to AI Tool Hub

</a>


<!-- =========================================
     MAIN CONTAINER
========================================= -->

<div class="container">


    <!-- =========================================
         HEADER
    ========================================= -->

    <div class="header">

        <h1>
            💻 AI Coding Assistant
        </h1>

        <p>
            Generate, explain, debug and improve your code with AI
        </p>

    </div>


    <!-- =========================================
         CODING BOX
    ========================================= -->

    <div class="coding-box">


        <!-- =====================================
             INPUT PANEL
        ====================================== -->

        <div class="panel">

            <h2>
                Coding Assistant
            </h2>


            <!-- LANGUAGE -->

            <div class="form-group">

                <label for="language">

                    Programming Language

                </label>


                <select id="language">

                    <option value="Java">
                        Java
                    </option>

                    <option value="Python">
                        Python
                    </option>

                    <option value="C">
                        C
                    </option>

                    <option value="C++">
                        C++
                    </option>

                    <option value="JavaScript">
                        JavaScript
                    </option>

                    <option value="HTML">
                        HTML
                    </option>

                    <option value="CSS">
                        CSS
                    </option>

                    <option value="SQL">
                        SQL
                    </option>

                </select>

            </div>


            <!-- TASK -->

            <div class="form-group">

                <label for="task">

                    Select Task

                </label>


                <select id="task">

                    <option value="Generate Code">
                        Generate Code
                    </option>

                    <option value="Explain Code">
                        Explain Code
                    </option>

                    <option value="Debug Code">
                        Debug Code
                    </option>

                    <option value="Optimize Code">
                        Optimize Code
                    </option>

                </select>


                <div class="task-description">

                    Choose what you want the AI
                    coding assistant to do.

                </div>

            </div>


            <!-- CODE / QUESTION -->

            <div class="form-group">

                <label for="codeInput">

                    Code or Coding Question

                </label>


                <textarea
                    id="codeInput"
                    placeholder="Example:

Write a Java program to check whether a number is prime.

OR paste your existing code here..."></textarea>

            </div>


            <!-- CSRF TOKEN -->

            <form style="display:none;">

                {% csrf_token %}

            </form>


            <!-- BUTTON -->

            <button
                id="codingButton"
                class="coding-button">

                ✨ Ask AI

            </button>


        </div>


        <!-- =====================================
             OUTPUT PANEL
        ====================================== -->

        <div class="panel">

            <h2>
                AI Response
            </h2>


            <div
                id="codeOutput"
                class="code-output">

                <span class="output-placeholder">

                    Your AI coding response
                    will appear here...

                </span>

            </div>

        </div>


    </div>


</div>


<!-- =========================================
     JAVASCRIPT
========================================= -->

<script>


const codingButton =
    document.getElementById(
        "codingButton"
    );


const language =
    document.getElementById(
        "language"
    );


const task =
    document.getElementById(
        "task"
    );


const codeInput =
    document.getElementById(
        "codeInput"
    );


const codeOutput =
    document.getElementById(
        "codeOutput"
    );


const csrfToken =
    document.querySelector(
        "[name=csrfmiddlewaretoken]"
    ).value;



codingButton.addEventListener(
    "click",
    async function () {


        const code =
            codeInput.value.trim();


        const selectedLanguage =
            language.value;


        const selectedTask =
            task.value;


        /* =========================
           EMPTY INPUT
        ========================= */

        if (!code) {

            codeOutput.textContent =
                "Please enter your code or coding question.";

            return;
        }


        /* =========================
           BUTTON STATE
        ========================= */

        codingButton.disabled = true;

        codingButton.textContent =
            "⏳ Processing...";


        codeOutput.textContent = "";


        try {


            /* =========================
               SEND REQUEST
            ========================= */

            const response =
                await fetch(
                    "/coding/",
                    {

                        method: "POST",

                        headers: {

                            "Content-Type":
                                "application/x-www-form-urlencoded",

                            "X-CSRFToken":
                                csrfToken

                        },

                        body:
                            new URLSearchParams({

                                language:
                                    selectedLanguage,

                                task:
                                    selectedTask,

                                code:
                                    code

                            })

                    }
                );


            /* =========================
               ERROR CHECK
            ========================= */

            if (!response.ok) {

                throw new Error(
                    "Server error: " +
                    response.status
                );
            }


            /* =========================
               READ STREAM
            ========================= */

            const reader =
                response.body.getReader();


            const decoder =
                new TextDecoder();


            while (true) {


                const {
                    value,
                    done
                } =
                    await reader.read();


                if (done) {

                    break;
                }


                const chunk =
                    decoder.decode(
                        value,
                        {
                            stream: true
                        }
                    );


                codeOutput.textContent +=
                    chunk;


                codeOutput.scrollTop =
                    codeOutput.scrollHeight;
            }


        }


        catch (error) {

            console.error(error);


            codeOutput.textContent =
                "Something went wrong. Please try again.";
        }


        finally {

            codingButton.disabled = false;

            codingButton.textContent =
                "✨ Ask AI";
        }

    }
);

</script>


</body>

</html>
